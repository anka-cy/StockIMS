spring.application.name=stock-ims
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_ims?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:stock_app}
spring.datasource.password=${DB_PASSWORD:stock_app_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=false
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
